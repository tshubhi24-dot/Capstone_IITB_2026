global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: analyst-desk
    metrics_path: /metrics
    http_headers:
      X-Analyst-Metrics-Token:
        files: [/run/metrics/token]
    static_configs:
      - targets: [app:8000]
