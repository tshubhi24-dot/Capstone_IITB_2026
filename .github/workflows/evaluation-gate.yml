name: Analyst Desk Evaluation Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyst-desk-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  c1-development-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jayshree/analyst_desk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jayshree/analyst_desk/requirements.txt

      - name: Install CPU-only PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r requirements.txt

      - name: Require OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY as a GitHub Actions repository secret before running this workflow."
            exit 1
          fi

      - name: Run C1 development evaluation gate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --configs c1 \
            --split dev \
            --min-cases 20 \
            --min-success-rate 0.95 \
            --tag "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyst-desk-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: jayshree/analyst_desk/data/evaluation/results/eval_dev_ci-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 14
