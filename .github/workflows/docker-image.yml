name: Analyst Desk Docker Image

# One image for the whole team, built from reviewed code:
#   push to main      build (with the search index baked in) and publish to
#                     ghcr.io/<owner>/analyst-desk as :main and :sha-<commit>
#   pull request      build only (no index, nothing published), so a broken
#                     Dockerfile or lock file fails the PR
# Teammates then run `docker compose pull && docker compose up` (see README).

on:
  push:
    branches: [main]
    paths:
      - "jayshree/analyst_desk/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "jayshree/analyst_desk/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: analyst-desk-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/analyst-desk" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build (and publish from main)
        uses: docker/build-push-action@v6
        with:
          context: jayshree/analyst_desk
          file: jayshree/analyst_desk/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BAKE_INDEX=${{ github.event_name == 'pull_request' && '0' || '1' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
