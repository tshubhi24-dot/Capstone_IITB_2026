name: Analyst Desk CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyst-desk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: analyst_desk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyst_desk/requirements.lock

      - name: Install CPU-only PyTorch and project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.15.0+cpu"
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Run unit and data-integrity tests
        run: python -m unittest discover -s tests -v

      - name: Validate archived historical development evidence (read-only)
        run: |
          python scripts/report.py audit \
            --input data/evaluation/archive/pre_cleanup_20261111/eval_dev_merged.json \
            --cases data/evaluation/development/dev_cases.jsonl \
            --configs c0 c1 c2 --min-cases 20

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --project-directory . -f deployment/compose.yaml config --quiet

      - name: Validate and test Prometheus alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/docker/prometheus:/work:ro" prom/prometheus:v3.1.0 \
            check rules /work/alerts.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/docker/prometheus:/work:ro" prom/prometheus:v3.1.0 \
            test rules /work/alerts.test.yml
