# Exact versions for the Docker image (Linux, Python 3.12, CPU-only torch).
# Generated from a working image with `pip freeze`; the Dockerfile installs from this file,
# so every build gets the same libraries. requirements.txt stays the human-edited list
# (and is what a local Python venv installs).
#
# To update after changing requirements.txt:
#   docker build --build-arg REQUIREMENTS=requirements.txt -t analystdesk:relock .
#   docker run --rm --entrypoint pip analystdesk:relock freeze > requirements.lock.new
#   then keep this header, replace the pins, test, and commit.
