# Analyst Desk — app + four MCP servers.
#
#   docker compose up --build      first time (builds images, then the index)
#   docker compose up              afterwards
#   open http://127.0.0.1:7861
#
# Needs: .env with OPENROUTER_API_KEY (see .env.example). The first start
# builds the vector index once (~10 min on CPU); later starts reuse it.
# Also starts Jaeger (traces, :16686), Prometheus (metrics + alert, :9090)
# and Grafana (dashboard, :3000).

x-image: &image
  image: analystdesk:latest
  build: .

x-data: &data
  - ./data/passages:/app/data/passages:ro
  - ./data/edgar_cache:/app/data/edgar_cache:ro
  - index:/app/data/index

x-mcp: &mcp
  <<: *image
  restart: unless-stopped
  networks: [tools]
  environment: &mcp-env
    MCP_TRANSPORT: http
    MCP_PORT: "8000"
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 20s

services:
  # Builds the Chroma index once, then exits. Everything that reads the index
  # waits for it, so two processes never build it at the same time.
  index:
    <<: *image
    command: ["python", "-c", "from analystdesk.retrieve import get_retriever; get_retriever(); print('Index initialization completed successfully')"]
    volumes: *data
    networks: [tools]

  filings-kb:
    <<: *mcp
    command: ["python", "-m", "analystdesk.servers.filings_kb"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: "filings-kb:8000,filings-kb"
    volumes: *data
    depends_on:
      index: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # loads the embedding + reranker models first

  edgar:
    <<: *mcp
    command: ["python", "-m", "analystdesk.servers.edgar_server"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: "edgar:8000,edgar"
    volumes:
      - ./data/edgar_cache:/app/data/edgar_cache:ro

  # Runs LLM-written code. This container *is* the boundary: no internet
  # (internal network), read-only filesystem, no capabilities, non-root,
  # process/memory limits. Code runs in a guarded child process inside it.
  python-sandbox:
    <<: *mcp
    command: ["python", "-m", "analystdesk.servers.sandbox"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: "python-sandbox:8000,python-sandbox"
      SANDBOX_MODE: local
    read_only: true
    tmpfs: ["/tmp:size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m

  research-portal:
    <<: *mcp
    command: ["python", "-m", "analystdesk.servers.portal"]
    environment:
      <<: *mcp-env
      MCP_ALLOWED_HOSTS: "research-portal:8000,research-portal"
      APPROVAL_SECRET: ${APPROVAL_SECRET:-}
    volumes:
      - portal:/app/data/portal
      - approval:/app/data/approval   # verifies with the shared signing key

  app:
    <<: *image
    command: ["python", "app.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7861/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    env_file: [.env]
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "7861"
      SANDBOX_MODE: local
      # The agent graph (Phase 4) reaches the tools here
      MCP_URL_FILINGS_KB: http://filings-kb:8000/mcp
      MCP_URL_EDGAR: http://edgar:8000/mcp
      MCP_URL_PYTHON_SANDBOX: http://python-sandbox:8000/mcp
      MCP_URL_RESEARCH_PORTAL: http://research-portal:8000/mcp
      METRICS_HOST: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./data/passages:/app/data/passages:ro
      - ./data/edgar_cache:/app/data/edgar_cache:ro
      - ./data/evaluation:/app/data/evaluation
      - index:/app/data/index
      - runs:/app/data/runs
      - memory:/app/data/memory
      - portal:/app/data/portal
      - approval:/app/data/approval   # shared approval tokens with the portal
    ports:
      - "127.0.0.1:7861:7861"   # this machine only
    networks: [tools, outside]
    depends_on:
      index: {condition: service_completed_successfully}
      filings-kb: {condition: service_healthy}
      edgar: {condition: service_healthy}
      python-sandbox: {condition: service_healthy}
      research-portal: {condition: service_healthy}

  # ── observe ────────────────────────────────────────────────────────────────
  jaeger:          # traces (as in the L14 lecture notebook): http://127.0.0.1:16686
    image: jaegertracing/jaeger:2.2.0
    restart: unless-stopped
    ports: ["127.0.0.1:16686:16686"]
    networks: [tools, outside]

  prometheus:      # metrics + the 98% verified-share alert: http://127.0.0.1:9090/alerts
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [tools, outside]

  grafana:         # dashboard: http://127.0.0.1:3000 (anonymous viewer)
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [tools, outside]
    depends_on: [prometheus]

networks:
  tools:
    internal: true   # no route to the internet
  outside: {}        # the app's way out (OpenRouter) and its published port

volumes:
  index:
  runs:
  memory:
  portal:
  approval:
